          });
          if (el) {
            el.classList.remove('linea-sin-sombra');
            el.style.pointerEvents = '';
          }
          if (map.hasLayer(l)) l.bringToFront();
          (decoradoresCapas.get(l) || []).forEach(d => {
            if (map.hasLayer(l) && !map.hasLayer(d)) d.addTo(map);
          });
        } else {
          l.setStyle({ opacity: 0.15 });
          if (el) {
            el.classList.add('linea-sin-sombra');
            el.style.pointerEvents = 'none'; // atenuada: sin ficha ni resaltado
          }
          // Quitar flechas de las líneas que no están destacadas
          (decoradoresCapas.get(l) || []).forEach(d => {
            if (map.hasLayer(d)) map.removeLayer(d);
          });
        }
      });

      // Que el marcador de búsqueda quede siempre encima
      if (marcadorBusqueda) marcadorBusqueda.bringToFront();
    }

    function destacarLinea(nombre) {
      lineaDestacada = nombre;

      // Si alguna línea estaba oculta (casilla o filtro UV), mostrarla
      [].concat(nombre).forEach(n => {
        (capasLineas[n] || []).forEach(l => { if (!map.hasLayer(l)) map.addLayer(l); });
        const chk = document.querySelector(`.check-linea[onchange*="'${n}'"]`);
        if (chk) chk.checked = true;
      });
      sincronizarMaestro();

      // Hay líneas visibles: la capa "Recorridos Buses" debe verse marcada
      const chkCapa = document.querySelector('.check-capa[data-capa="Recorridos Buses"]');
      if (chkCapa) chkCapa.checked = true;

      aplicarDestacado(nombre);
      actualizarChips();
    }

    function quitarDestacado() {
      if (!lineaDestacada) return;
      lineaDestacada = null;

      const grupo = overlays['Recorridos Buses'];
      if (grupo) {
        grupo.eachLayer(l => {
          grupo.resetStyle(l);
          const el = l.getElement();
          if (el) {
            el.classList.remove('linea-sin-sombra');
            el.style.opacity = 1;
            el.style.pointerEvents = '';
          }
        });
      }

      decoradoresCapas.forEach(decs => {
        decs.forEach(d => { if (map.hasLayer(d)) map.removeLayer(d); });
      });

      actualizarChips();
    }

    function actualizarChips() {
      document.querySelectorAll('#buscador-info .chip, .ficha-uv .chip[data-linea]').forEach(chip => {
        const activa = chip.dataset.linea === lineaDestacada;
        chip.classList.toggle('activo', activa);
        chip.setAttribute('aria-pressed', activa);
      });
    }

    // Clic en una etiqueta: destacar; segundo clic en la misma: quitar
    infoBusqueda.addEventListener('click', e => {
      const chip = e.target.closest('.chip');
      if (!chip) return;
      if (chip.dataset.linea === lineaDestacada) quitarDestacado();
      else destacarLinea(chip.dataset.linea);
    });

    // Clic en una zona vacía del mapa: quitar destacado.
    // Se mantiene si el clic fue sobre una UV, una ruta o el marcador de búsqueda.
    map.on('click', e => {
      if (!lineaDestacada) return;
      if (modoActual === 'viaje' && viaje.opciones.length) return; // el viaje sigue a la vista
      const origen = e.sourceTarget;
      if (origen === marcadorBusqueda) return;
      if (typeof capaViaje !== 'undefined' && capaViaje.hasLayer(origen)) return;
      const props = origen && origen.feature && origen.feature.properties;
      if (props && (props.NOMBRE_UV || props.linea)) return;
      quitarDestacado();
    });

    // Pantalla táctil: detectar el toque en zona vacía directamente
    // (algunos navegadores no generan 'click' al tocar el fondo del mapa)
    if (ES_TACTIL) {
      const contenedorMapa = map.getContainer();
      let inicioToque = null;

      contenedorMapa.addEventListener('pointerdown', e => {
        inicioToque = { x: e.clientX, y: e.clientY, t: Date.now() };
      });

      contenedorMapa.addEventListener('pointerup', e => {
        if (!inicioToque || !lineaDestacada) return;
        if (modoActual === 'viaje' && viaje.opciones.length) { inicioToque = null; return; }
        const movio = Math.hypot(e.clientX - inicioToque.x, e.clientY - inicioToque.y) > 10;
        const largo = Date.now() - inicioToque.t > 500;
        inicioToque = null;
        if (movio || largo) return; // fue arrastre o toque largo, no un toque

        const el = e.target;
        const enMapa    = el.closest('.leaflet-map-pane') || el === contenedorMapa;
        const enObjeto  = el.closest('.leaflet-interactive, .leaflet-popup, .leaflet-control');
        if (enMapa && !enObjeto) quitarDestacado();
      });
    }

    // Tecla Escape: quitar destacado
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && lineaDestacada) quitarDestacado();
    });

    function limpiarBusqueda(enfocar = true) {
      quitarDestacado();
      inputBuscar.value = '';
      btnLimpiar.hidden = true;
      infoBusqueda.hidden = true;
      clearTimeout(temporizadorBusqueda);
      if (peticionBusqueda) peticionBusqueda.abort();
      setBuscando(false);
      ocultarResultados();
      if (marcadorBusqueda) {
        map.removeLayer(marcadorBusqueda);
        marcadorBusqueda = null;
      }
      if (enfocar) inputBuscar.focus();
    }

    // Buscar mientras escribe (con pausa para no saturar el servicio)
    inputBuscar.addEventListener('input', () => {
      const texto = inputBuscar.value.trim();
      btnLimpiar.hidden = !inputBuscar.value;
      clearTimeout(temporizadorBusqueda);

      if (texto.length < 3) {
        if (peticionBusqueda) peticionBusqueda.abort();
        setBuscando(false);
        ocultarResultados();
        return;
      }
      setBuscando(true); // feedback inmediato, aunque la búsqueda parta en 350 ms
      temporizadorBusqueda = setTimeout(() => buscarCalle(texto), 350);
    });

    // Teclado: flechas, Enter y Escape
    inputBuscar.addEventListener('keydown', e => {
      const n = resultadosBusqueda.length;
      if (e.key === 'ArrowDown' && n && !listaResultados.hidden) {
        e.preventDefault();
        indiceActivo = (indiceActivo + 1) % n;
        resaltarActivo();
      } else if (e.key === 'ArrowUp' && n && !listaResultados.hidden) {
        e.preventDefault();
        indiceActivo = (indiceActivo - 1 + n) % n;
        resaltarActivo();
      } else if (e.key === 'Enter' && n && !listaResultados.hidden) {
        e.preventDefault();
        seleccionarResultado(resultadosBusqueda[Math.max(indiceActivo, 0)]);
      } else if (e.key === 'Escape') {
        ocultarResultados();
      }
    });

    listaResultados.addEventListener('click', e => {
      const li = e.target.closest('li[data-i]');
      if (li) seleccionarResultado(resultadosBusqueda[+li.dataset.i]);
    });

    // Cerrar sugerencias al hacer clic fuera del buscador
    document.addEventListener('click', e => {
      if (!e.target.closest('.buscador')) ocultarResultados();
    });


    // ======================
    // FICHA DE UNIDAD VECINAL
    // ======================
    // Habitantes y cobertura: Censo 2024 (manzanas, scripts/calcular_cobertura.mjs).
    // Edades, inmigrantes, pueblos originarios, hogares y viviendas: Censo 2017
    // (columnas del archivo de UV). Servicios: conteos del archivo de UV.

    const numUV = v => Number(v) || 0;
    const fmtEntero = v => Math.round(v).toLocaleString('es-CL');
    const fmtPctUV = (a, b) => b
      ? (100 * a / b).toLocaleString('es-CL', { maximumFractionDigits: 1 }) + ' %'
      : '–';

    // Líneas cuyo recorrido pasa por la UV (se calcula una vez por UV)
    const cacheLineasUV = new Map();
    function lineasEnUV(feature) {
      const nombre = feature.properties.NOMBRE_UV;
      if (cacheLineasUV.has(nombre)) return cacheLineasUV.get(nombre);
      if (!geojsonBuses) return [];

      const lineas = new Map(); // línea → frecuencia
      geojsonBuses.features.forEach(f => {
        try {
          if (!lineas.has(f.properties.linea) && turf.booleanIntersects(f, feature)) {
            lineas.set(f.properties.linea, f.properties.frecuencia || '');
          }
        } catch (e) {}
      });
      const lista = [...lineas.entries()]
        .sort((a, b) => parseInt(a[0].replace(/\D/g, '')) - parseInt(b[0].replace(/\D/g, '')));
      cacheLineasUV.set(nombre, lista);
      return lista;
    }

    // Promedios de Copiapó (suma de las UV urbanas) para comparar cada UV con la comuna
    let promediosComunaUV = null;
    function promediosComuna() {
      if (promediosComunaUV) return promediosComunaUV;
      if (!coberturaUV) return null;
      const s = {};
      Object.values(coberturaUV.uv).forEach(v => {
        Object.entries(v.censo || {}).forEach(([k, n]) => { s[k] = (s[k] || 0) + (n || 0); });
        s._pob = (s._pob || 0) + v.poblacion;
      });
      const ind = indicadoresCenso(s);
      // Áreas verdes (archivo de UV) por habitante 2024
      if (geojsonUV) {
        const verde = geojsonUV.features.filter(f => f.properties.urbano === 1)
          .reduce((a, f) => a + numUV(f.properties.AREA_VERDE), 0);
        ind.m2hab = s._pob ? verde / s._pob : null;
      }
      promediosComunaUV = ind;
      return ind;
    }

    // Fracciones (0–1) a partir de los conteos del Censo 2024
    function indicadoresCenso(c) {
      const div = (a, b) => b ? a / b : 0;
      const per = c.n_per || 0;
      const tras = ['publico', 'auto', 'camina', 'bicicleta', 'motocicleta', 'cab_lan_bote', 'otros']
        .reduce((s, m) => s + (c['n_transporte_' + m] || 0), 0);
      return {
        ninos:   div((c.n_edad_0_5 || 0) + (c.n_edad_6_13 || 0), per),
        adolesc: div(c.n_edad_14_17 || 0, per),
        adultos: div((c.n_edad_18_24 || 0) + (c.n_edad_25_44 || 0) + (c.n_edad_45_59 || 0), per),
        mayores: div(c.n_edad_60_mas || 0, per),
        inm:     div(c.n_inmigrantes || 0, per),
        pueblo:  div(c.n_pueblos_orig || 0, per),
        disc:    div(c.n_discapacidad || 0, per),
        mujeres: div(c.n_mujeres || 0, per),
        tp:      div(c.n_transporte_publico || 0, tras),
        auto:    div(c.n_transporte_auto || 0, tras),
        camina:  div(c.n_transporte_camina || 0, tras),
        otros:   div((c.n_transporte_bicicleta || 0) + (c.n_transporte_motocicleta || 0)
                   + (c.n_transporte_cab_lan_bote || 0) + (c.n_transporte_otros || 0), tras),
        desoc:   div(c.n_desocupado || 0, (c.n_ocupado || 0) + (c.n_desocupado || 0)),
        hacin:   div(c.n_viv_hacinadas || 0, c.n_vp_ocupada || 0),
        sinInt:  div(Math.max(0, (c.n_hog || 0) - (c.n_internet || 0)), c.n_hog || 0),
        jefa:    div(c.n_jefatura_mujer || 0, c.n_hog || 0),
        tras
      };
    }

    const fmtFraccion = f => (100 * f).toLocaleString('es-CL', { maximumFractionDigits: 1 }) + ' %';

    // "Copiapó 24,6 %" con flecha si la UV está claramente sobre/bajo el promedio
    function comparacion(valor, promedio, fmt = fmtFraccion) {
      if (promedio == null || !isFinite(promedio)) return '';
      const rel = promedio ? valor / promedio : 1;
      const flecha = rel > 1.15 ? '<i class="fa-solid fa-arrow-up"></i>'
                   : rel < 0.85 ? '<i class="fa-solid fa-arrow-down"></i>' : '';
      return `<small class="comparacion">${flecha}Copiapó ${fmt(promedio)}</small>`;
    }

    // Barra apilada + filas con comparación
    function htmlBarraFilas(items, prom) {
      const barra = items.map(e =>
        `<span style="width:${100 * e.f}%;background:${e.color}"></span>`).join('');
      const filas = items.map(e => `
        <div class="fila-banda fila-ficha">
          <span class="muestra-area" style="background:${e.color};opacity:1"></span>
          ${e.etiqueta}
          <span class="valor"><b>${fmtFraccion(e.f)}</b>${prom ? comparacion(e.f, prom[e.clave]) : ''}</span>
        </div>`).join('');
      return `<div class="barra-cobertura barra-ficha">${barra}</div>${filas}`;
    }

    // Mosaico con cifra, etiqueta y comparación
    const tarjeta = (valor, etiqueta, extra = '') => `<div><b>${valor}</b><span>${etiqueta}</span>${extra}</div>`;

    function htmlFichaUV(feature, poblacion2024, datosCobertura) {
      const p = feature.properties;
      const prom = promediosComuna();
      const c = datosCobertura && datosCobertura.censo;
      const ind = c ? indicadoresCenso(c) : null;
      const cmp = (clave, v) => prom ? comparacion(v, prom[clave]) : '';

      // --- Servicios (archivo de UV) ---
      const salud = numUV(p.TOTAL_SALU);
      const detalleSalud = salud
        ? [[numUV(p.SALUD_PUBL), 'público', 'públicos'], [numUV(p.SALUD_PRIV), 'privado', 'privados'], [numUV(p.SALUD_OTRO), 'otro', 'otros']]
            .filter(([n]) => n > 0).map(([n, uno, varios]) => `${n} ${n === 1 ? uno : varios}`).join(' · ')
        : '';
      const m2PorHab = poblacion2024 ? numUV(p.AREA_VERDE) / poblacion2024 : 0;
      const fmtM2 = v => v.toLocaleString('es-CL', { maximumFractionDigits: 1 }) + ' m²/hab';
      const servicios = [
        { icono: 'fa-house-medical',               texto: 'Centros de salud',        valor: salud, detalle: detalleSalud },
        { icono: 'fa-school',                      texto: 'Establec. educacionales', valor: numUV(p.T_EDUCACIO) },
        { icono: 'fa-prescription-bottle-medical', texto: 'Farmacias',               valor: numUV(p.FARMACIAS) },
        { icono: 'fa-cart-shopping',               texto: 'Supermercados',           valor: numUV(p.SUPERMERCA) },
        { icono: 'fa-futbol',                      texto: 'Recintos deportivos',     valor: numUV(p.DEPORTE) },
        { icono: 'fa-tree',                        texto: 'Áreas verdes',
          valor: (numUV(p.AREA_VERDE) / 10000).toLocaleString('es-CL', { maximumFractionDigits: 1 }) + ' ha',
          detalle: m2PorHab
            ? `${fmtM2(m2PorHab)}${prom && prom.m2hab ? comparacion(m2PorHab, prom.m2hab, fmtM2).replace('<small class="comparacion">', ' <span class="comparacion">').replace('</small>', '</span>') : ''}`
            : '' },
        { icono: 'fa-shield-halved',               texto: 'Carabineros / PDI',       valor: numUV(p.CARABINERO) + numUV(p.PDI) },
        { icono: 'fa-fire-extinguisher',           texto: 'Bomberos',                valor: numUV(p.BOMBEROS) }
      ];
      const htmlServicios = servicios.map(s => `
        <div class="servicio ${s.valor === 0 ? 'servicio-cero' : ''}">
          <i class="fa-solid ${s.icono}"></i>
          <div>
            <b>${s.valor}</b>
            <span>${s.texto}</span>
            ${s.detalle ? `<small>${s.detalle}</small>` : ''}
          </div>
        </div>`).join('');

      // --- Líneas que recorren la UV ---
      const lineas = lineasEnUV(feature);
      const htmlLineas = lineas.length
        ? `<div class="chips">${lineas.map(([l, frec]) => `
            <button class="chip" data-linea="${escaparHTML(l)}" aria-pressed="${esLineaDestacada(l)}"
                    style="--color-linea:${coloresLineas[l] || '#666'}" title="Destacar ${escaparHTML(l)} en el mapa">
              <span class="muestra-linea" style="background:${coloresLineas[l] || '#666'}"></span>${escaparHTML(l)}
              ${frec ? `<span class="frecuencia">${escaparHTML(frec.replace(/buses/i, 'buses'))}</span>` : ''}
            </button>`).join('')}</div>`
        : '<p class="nota" style="margin:0">Ninguna línea recorre esta UV.</p>';

      // --- Secciones del Censo 2024 (si cargó el resumen) ---
      let censo = '';
      if (ind) {
        const estudiantes = (c.n_asistencia_basica || 0) + (c.n_asistencia_media || 0) + (c.n_asistencia_superior || 0);
        censo = `
          <div class="viaje-seccion-titulo"><span><i class="fa-solid fa-people-group"></i> Población</span><span class="ficha-anio">Censo 2024</span></div>
          ${htmlBarraFilas([
            { etiqueta: 'Niños (0–13)',        f: ind.ninos,   color: '#60a5fa', clave: 'ninos' },
            { etiqueta: 'Adolescentes (14–17)', f: ind.adolesc, color: '#a5b4fc', clave: 'adolesc' },
            { etiqueta: 'Adultos (18–59)',     f: ind.adultos, color: '#cbd5e1', clave: 'adultos' },
            { etiqueta: 'Mayores (60 y más)',  f: ind.mayores, color: '#f59e0b', clave: 'mayores' }
          ], prom)}
          <div class="ficha-par">
            ${tarjeta(fmtFraccion(ind.inm), 'inmigrantes', cmp('inm', ind.inm))}
            ${tarjeta(fmtFraccion(ind.pueblo), 'pueblos originarios', cmp('pueblo', ind.pueblo))}
            ${tarjeta(fmtFraccion(ind.disc), 'con discapacidad', cmp('disc', ind.disc))}
            ${tarjeta(fmtFraccion(ind.mujeres), 'mujeres', cmp('mujeres', ind.mujeres))}
          </div>

          <div class="viaje-seccion-titulo"><span><i class="fa-solid fa-person-walking-arrow-right"></i> Movilidad</span><span class="ficha-anio">Censo 2024</span></div>
          <div class="ficha-subtitulo" style="margin-top:0">Cómo se trasladan a trabajar o estudiar</div>
          ${htmlBarraFilas([
            { etiqueta: 'Transporte público', f: ind.tp,     color: '#2563eb', clave: 'tp' },
            { etiqueta: 'Auto',               f: ind.auto,   color: '#64748b', clave: 'auto' },
            { etiqueta: 'A pie',              f: ind.camina, color: '#16a34a', clave: 'camina' },
            { etiqueta: 'Bicicleta, moto y otros', f: ind.otros, color: '#e2e8f0', clave: 'otros' }
          ], prom)}
          ${datosCobertura.tp_lejos_200 > 0 ? `
            <div class="ficha-alerta">
              <i class="fa-solid fa-triangle-exclamation"></i>
              <span><b>${fmtEntero(datosCobertura.tp_lejos_200)}</b> usuarios de transporte público viven a 200 m o más de un recorrido</span>
            </div>` : ''}

          <div class="viaje-seccion-titulo"><span><i class="fa-solid fa-briefcase"></i> Empleo y educación</span></div>
          <div class="ficha-kpis">
            ${tarjeta(fmtFraccion(ind.desoc), 'desocupación', cmp('desoc', ind.desoc))}
            ${tarjeta(c.prom_escolaridad18 != null ? c.prom_escolaridad18.toLocaleString('es-CL') + ' años' : '–', 'escolaridad (18+)')}
            ${tarjeta(fmtEntero(estudiantes), 'estudiantes',
              `<small class="comparacion">${fmtEntero(c.n_asistencia_basica || 0)} básica · ${fmtEntero(c.n_asistencia_media || 0)} media · ${fmtEntero(c.n_asistencia_superior || 0)} sup.</small>`)}
          </div>

          <div class="viaje-seccion-titulo"><span><i class="fa-solid fa-house-chimney-user"></i> Hogares y vivienda</span></div>
          <div class="ficha-kpis">
            ${tarjeta(fmtFraccion(ind.hacin), 'viviendas hacinadas', cmp('hacin', ind.hacin))}
            ${tarjeta(fmtFraccion(ind.sinInt), 'hogares sin internet', cmp('sinInt', ind.sinInt))}
            ${tarjeta(fmtFraccion(ind.jefa), 'jefatura femenina', cmp('jefa', ind.jefa))}
          </div>`;
      }

      const habitantes = c ? c.n_per : (poblacion2024 || numUV(p.PERSONAS));

      return `
        <div class="ficha-uv">
          <div class="ficha-cabecera">
            <span class="ficha-icono"><i class="fa-solid fa-map-location-dot"></i></span>
            <div>
              <span class="ficha-tipo">${p.ficticia
                ? 'UV ficticia <span class="insignia insignia-ficticia">creada para el análisis</span>'
                : `Unidad Vecinal${p.CODIGO_UV ? ` · N° ${escaparHTML(p.CODIGO_UV)}` : ''}`}</span>
              <h3>${escaparHTML(p.NOMBRE_UV || 'Sin nombre')}</h3>
            </div>
          </div>

          <div class="ficha-kpis">
            <div><i class="fa-solid fa-users"></i><b>${fmtEntero(habitantes)}</b><span>habitantes</span></div>
            <div><i class="fa-solid fa-house-chimney"></i><b>${fmtEntero(c ? c.n_hog : numUV(p.HOGARES))}</b><span>hogares</span></div>
            <div><i class="fa-solid fa-cake-candles"></i><b>${c && c.prom_edad != null ? c.prom_edad.toLocaleString('es-CL') : '–'}</b><span>edad promedio</span></div>
          </div>

          ${censo}

          ${p.ficticia ? `
          <p class="nota ficha-aviso-ficticia">
            <i class="fa-solid fa-circle-info"></i>
            Área urbana (sectores altos y tomas) dentro de la UV rural "Copiapó Este". Se trazó a partir
            de sus manzanas del Censo 2024 para incluirla en el análisis. No tiene datos de servicios.
          </p>` : `
          <div class="viaje-seccion-titulo"><span><i class="fa-solid fa-building-columns"></i> Servicios</span></div>
          <div class="ficha-servicios">${htmlServicios}</div>`}

          <div class="viaje-seccion-titulo"><span><i class="fa-solid fa-bus"></i> Transporte</span><span class="contador">${lineas.length} ${lineas.length === 1 ? 'línea' : 'líneas'}</span></div>
          ${htmlLineas}
          ${datosCobertura ? `
            <div class="popup-cobertura">
              <div class="ficha-subtitulo">Distancia de la población a un recorrido</div>
              ${htmlBandas(datosCobertura)}
            </div>` : ''}

          <p class="nota ficha-fuente">
            <i class="fa-solid fa-circle-info"></i>
            Población, movilidad, empleo, hogares y vivienda: Censo 2024 (INE), por manzana.
            Servicios: archivo de UV. "Copiapó" = total de las UV urbanas.
            Inmigrantes y pueblos originarios pueden estar subestimados (el INE oculta cifras pequeñas).
          </p>
        </div>`;
    }

    // Opciones del popup: ancho y alto según la pantalla, sin quedar bajo el panel
    function opcionesFichaUV() {
      const movil = esMovil();
      const altoMini = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--alto-mini')) || 150;
      return {
        className: 'popup-ficha-uv',
        maxWidth: Math.min(330, window.innerWidth - 32),
        minWidth: Math.min(280, window.innerWidth - 48),
        maxHeight: Math.round(Math.min(560, window.innerHeight * (movil ? 0.55 : 0.7))),
        autoPanPaddingTopLeft: [movil ? 12 : 320, 12],
        autoPanPaddingBottomRight: [12, movil ? altoMini + 12 : 12]
      };
    }

    // Chips de líneas dentro de la ficha: destacar / quitar destacado
    document.addEventListener('click', e => {
      const chip = e.target.closest('.ficha-uv .chip[data-linea]');
      if (!chip) return;
      if (chip.dataset.linea === lineaDestacada) quitarDestacado();
      else destacarLinea(chip.dataset.linea);
    });

    // ======================
    // CÓMO LLEGAR DE A a B
    // ======================

    const VIAJE = {
      CAMINATA_MAX_M:   500, // distancia máxima caminando hasta/desde el bus
      TRANSBORDO_MAX_M: 200, // distancia máxima caminando entre dos líneas
      TRAMO_MIN_M:      150, // un viaje en bus más corto no tiene sentido
      CAMINA_M_MIN:      80, // 4,8 km/h
      BUS_M_MIN:        300, // 18 km/h promedio
      TRANSBORDO_MIN:     5, // minutos de penalización por cambiar de bus
      MUESTREO_M:        75  // cada cuántos metros se busca punto de transbordo
    };

    let modoActual = 'lugar';
    const viaje = { origen: null, destino: null, opciones: [], elegida: 0, token: 0, calculandoCalles: false };
    const capaViaje = L.layerGroup().addTo(map);
    const resultadosViaje = document.getElementById('viaje-resultados');

    // ----- Pestañas -----
    function cambiarModo(modo) {
      if (modo === modoActual) return;
      modoActual = modo;
      document.querySelectorAll('.modo').forEach(b => {
        const activo = b.dataset.modo === modo;
        b.classList.toggle('activo', activo);
        b.setAttribute('aria-selected', activo);
      });
      document.getElementById('modo-lugar').hidden = modo !== 'lugar';
      document.getElementById('modo-viaje').hidden = modo !== 'viaje';

      // Cada modo limpia lo que dejó el otro en el mapa
      if (modo === 'viaje') {
        limpiarBusqueda(false);
        if (viaje.opciones.length) dibujarOpcion(viaje.elegida);
      } else {
        cancelarEleccion();
        capaViaje.clearLayers();
        quitarDestacado();
      }
    }

    // ----- Geometría rápida en metros (proyección local de Copiapó) -----
    const R_TIERRA = 6371008.8;
    const COS_LAT0 = Math.cos(-27.37 * Math.PI / 180);
    const aXY = (lat, lng) => [
      R_TIERRA * lng * Math.PI / 180 * COS_LAT0,
      R_TIERRA * lat * Math.PI / 180
    ];
    const aLatLng = ([x, y]) => [
      y / R_TIERRA * 180 / Math.PI,
      x / (R_TIERRA * COS_LAT0) * 180 / Math.PI
    ];

    // Cada tramo (Ida / Regreso de cada línea) como polilínea con largo acumulado
    let rutasViaje = null;
    function prepararRutas() {
      if (rutasViaje || !geojsonBuses) return rutasViaje;
      rutasViaje = geojsonBuses.features.map(f => {
        const partes = f.geometry.type === 'LineString'
          ? [f.geometry.coordinates] : f.geometry.coordinates;
        const pts = [];
        partes.forEach(parte => parte.forEach(([lng, lat]) => {
          const p = aXY(lat, lng);
          const u = pts[pts.length - 1];
          if (!u || u[0] !== p[0] || u[1] !== p[1]) pts.push(p);
        }));
        const acum = [0];
        for (let i = 1; i < pts.length; i++) {
          acum.push(acum[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
        }
        return { props: f.properties, linea: f.properties.linea, pts, acum, largo: acum[acum.length - 1] };
      });
      return rutasViaje;
    }

    // Punto de la ruta más cercano a p: distancia y posición a lo largo del recorrido
    function masCercano(ruta, [px, py]) {
      let mejor = { dist: Infinity, loc: 0 };
      const { pts, acum } = ruta;
      for (let i = 1; i < pts.length; i++) {
        const [ax, ay] = pts[i - 1], [bx, by] = pts[i];
        const dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy;
        let t = l2 ? ((px - ax) * dx + (py - ay) * dy) / l2 : 0;
        t = Math.max(0, Math.min(1, t));
        const d = Math.hypot(ax + t * dx - px, ay + t * dy - py);
        if (d < mejor.dist) mejor = { dist: d, loc: acum[i - 1] + t * Math.sqrt(l2) };
      }
      return mejor;
    }

    // Coordenada en la posición 'loc' (metros desde el inicio del recorrido)
    function puntoEn(ruta, loc) {
      const { pts, acum } = ruta;
      if (loc <= 0) return pts[0];
      for (let i = 1; i < pts.length; i++) {
        if (acum[i] >= loc) {
          const t = (loc - acum[i - 1]) / ((acum[i] - acum[i - 1]) || 1);
          return [pts[i - 1][0] + t * (pts[i][0] - pts[i - 1][0]), pts[i - 1][1] + t * (pts[i][1] - pts[i - 1][1])];
        }
      }
      return pts[pts.length - 1];
    }

    // Parte del recorrido entre dos posiciones, como [lat, lng] para dibujar
    function tramoEntre(ruta, desde, hasta) {
      const salida = [puntoEn(ruta, desde)];
      ruta.acum.forEach((a, i) => { if (a > desde && a < hasta) salida.push(ruta.pts[i]); });
      salida.push(puntoEn(ruta, hasta));
      return salida.map(aLatLng);
    }

    // ----- Cálculo de opciones -----
    function crearOpcion(tramos, caminatas) {
      const metrosBus = tramos.reduce((s, t) => s + (t.hasta - t.desde), 0);
      const metrosCamina = caminatas.reduce((s, d) => s + d, 0);
      return {
        tramos,
        caminatas,
        metrosBus,
        metrosCamina,
        minutos: metrosCamina / VIAJE.CAMINA_M_MIN
               + metrosBus / VIAJE.BUS_M_MIN
               + (tramos.length - 1) * VIAJE.TRANSBORDO_MIN
      };
    }

    function calcularOpciones(origen, destino) {
      const rutas = prepararRutas();
      if (!rutas) return null;

      const A = aXY(origen.lat, origen.lng);
      const B = aXY(destino.lat, destino.lng);
      const info = rutas.map(r => ({ r, a: masCercano(r, A), b: masCercano(r, B) }));
      let opciones = [];

      // 1) Directo: la misma ruta pasa cerca de A y luego cerca de B (en ese orden)
      info.forEach(({ r, a, b }) => {
        if (a.dist <= VIAJE.CAMINATA_MAX_M && b.dist <= VIAJE.CAMINATA_MAX_M &&
            b.loc - a.loc >= VIAJE.TRAMO_MIN_M) {
          opciones.push(crearOpcion([{ r, desde: a.loc, hasta: b.loc }], [a.dist, b.dist]));
        }
      });

      // 2) Con un transbordo (solo si no hay directas)
      if (!opciones.length) {
        const desdeA = info.filter(x => x.a.dist <= VIAJE.CAMINATA_MAX_M);
        const haciaB = info.filter(x => x.b.dist <= VIAJE.CAMINATA_MAX_M);

        desdeA.forEach(x1 => haciaB.forEach(x2 => {
          if (x1.r.linea === x2.r.linea) return;
          let mejor = null;
          for (let l = x1.a.loc + VIAJE.TRAMO_MIN_M; l <= x1.r.largo; l += VIAJE.MUESTREO_M) {
            const c = masCercano(x2.r, puntoEn(x1.r, l));
            if (c.dist <= VIAJE.TRANSBORDO_MAX_M && x2.b.loc - c.loc >= VIAJE.TRAMO_MIN_M) {
              const op = crearOpcion(
                [{ r: x1.r, desde: x1.a.loc, hasta: l }, { r: x2.r, desde: c.loc, hasta: x2.b.loc }],
                [x1.a.dist, c.dist, x2.b.dist]
              );
              if (!mejor || op.minutos < mejor.minutos) mejor = op;
            }
          }
          if (mejor) opciones.push(mejor);
        }));
      }

      // Una opción por combinación de líneas (la más rápida), las 3 mejores
      const porLineas = {};
      opciones.forEach(o => {
        const clave = o.tramos.map(t => t.r.linea).join('>');
        if (!porLineas[clave] || o.minutos < porLineas[clave].minutos) porLineas[clave] = o;
      });
      opciones = Object.values(porLineas).sort((a, b) => a.minutos - b.minutos).slice(0, 3);

      return { opciones, distanciaDirecta: Math.hypot(A[0] - B[0], A[1] - B[1]) };
    }

    // ----- Formato -----
    const fmtMetros = m => m < 1000
      ? `${Math.max(10, Math.round(m / 10) * 10)} m`
      : `${(m / 1000).toLocaleString('es-CL', { maximumFractionDigits: 1 })} km`;
    const fmtMin = min => `${Math.max(1, Math.round(min))} min`;
    const chipLinea = l => `
      <span class="chip chip-estatico" style="--color-linea:${coloresLineas[l] || '#666'}">
        <span class="muestra-linea" style="background:${coloresLineas[l] || '#666'}"></span>${escaparHTML(l)}
      </span>`;

    function htmlPasos(o) {
      const pasos = [];
      o.tramos.forEach((t, i) => {
        const p = t.r.props;
        pasos.push(`
          <li><i class="fa-solid fa-person-walking"></i>
            Camina ${fmtMetros(o.caminatas[i])} ${i === 0 ? 'hasta el recorrido' : 'para el transbordo'}
          </li>
          <li><i class="fa-solid fa-bus" style="color:${coloresLineas[t.r.linea] || '#666'}"></i>
            <span>Toma la <b>${escaparHTML(t.r.linea)}</b> ${p.a ? `hacia <b>${escaparHTML(p.a)}</b>` : ''}
            y viaja ${fmtMetros(t.hasta - t.desde)}
            ${p.frecuencia ? `<span class="sub">Frecuencia: ${escaparHTML(p.frecuencia)}</span>` : ''}</span>
          </li>`);
      });
      pasos.push(`
        <li><i class="fa-solid fa-person-walking"></i>
          Camina ${fmtMetros(o.caminatas[o.caminatas.length - 1])} hasta el destino
        </li>`);
      return `<ol class="viaje-pasos">${pasos.join('')}</ol>`;
    }

    // ----- Caminata por calles (OSRM de FOSSGIS, perfil peatón) -----
    const cacheCaminatas = new Map();
    let creditoCaminata = false;

    // Ruta a pie entre a y b ([lat, lng]). Devuelve { metros, coords } o null si falla.
    function caminataPorCalles(a, b) {
      const clave = [a[0], a[1], b[0], b[1]].map(v => v.toFixed(5)).join(',');
      if (!cacheCaminatas.has(clave)) {
        const url = 'https://routing.openstreetmap.de/routed-foot/route/v1/foot/' +
          `${a[1]},${a[0]};${b[1]},${b[0]}?overview=full&geometries=geojson`;
        cacheCaminatas.set(clave, fetch(url, { signal: AbortSignal.timeout(8000) })
          .then(r => r.json())
          .then(d => {
            if (d.code !== 'Ok' || !d.routes || !d.routes.length) throw new Error('sin ruta');
            const r = d.routes[0];
            if (!creditoCaminata) {
              map.attributionControl.addAttribution('Caminata: <a href="https://routing.openstreetmap.de" target="_blank">FOSSGIS OSRM</a>');
              creditoCaminata = true;
            }
            return { metros: r.distance, coords: r.geometry.coordinates.map(([lng, lat]) => [lat, lng]) };
          })
          .catch(() => { cacheCaminatas.delete(clave); return null; }));
      }
      return cacheCaminatas.get(clave);
    }

    // Tramos a pie de una opción: A → subida, bajada → subida (transbordo), bajada → B
    function tramosAPie(o) {
      const puntos = [[viaje.origen.lat, viaje.origen.lng]];
      o.tramos.forEach(t => {
        puntos.push(aLatLng(puntoEn(t.r, t.desde)));
        puntos.push(aLatLng(puntoEn(t.r, t.hasta)));
      });
      puntos.push([viaje.destino.lat, viaje.destino.lng]);
      const pares = [];
      for (let i = 0; i < puntos.length; i += 2) pares.push([puntos[i], puntos[i + 1]]);
      return pares;
    }

    // ----- Caminatas por calles y elección de subida/bajada -----
    // La persona primero llega al camino caminable más cercano (punto de
    // entrada a la red de calles) y desde ahí camina POR LAS CALLES hasta la
    // ruta. Por eso la subida al bus se elige como el punto de la ruta más
    // cercano a esa entrada (no a la ubicación original), y la caminata se
    // pide al servicio de calles completa, sin recortarla ni cruzar en diagonal.

    // Largo en metros de una lista de puntos [lat, lng]
    function largoCamino(puntos) {
      let total = 0;
      for (let i = 1; i < puntos.length; i++) {
        const [x0, y0] = aXY(...puntos[i - 1]), [x1, y1] = aXY(...puntos[i]);
        total += Math.hypot(x1 - x0, y1 - y0);
      }
      return total;
    }

    // La caminata "toca" la ruta si pasa a menos de esto. Es estricto a propósito:
    // la vereda del mismo lado está a menos de 15 m, la del otro lado de una
    // avenida dividida a 25–40 m (y no se puede subir al bus desde ahí).
    const TOCA_RUTA_M = 15;

    // Corta cada caminata donde toca la ruta:
    //  - al subir: en el PRIMER punto donde la caminata toca la ruta del bus
    //  - al bajar: en el ÚLTIMO punto donde la caminata toca la ruta del bus anterior
    // Así no se camina junto a la línea para tomarla (o dejarla) más allá.
    function cortarDondeTocaRuta(o, caminos) {
      const T = o.tramos, n = T.length, MIN = VIAJE.TRAMO_MIN_M;

      return caminos.map((c, i) => {
        const anterior  = i > 0 ? T[i - 1] : null; // bus del que se baja
        const siguiente = i < n ? T[i] : null;     // bus al que se sube
        const xy = c.coords.map(([lat, lng]) => aXY(lat, lng));
        let inicio = 0, fin = xy.length - 1;

        if (siguiente) {
          for (let k = 0; k < xy.length; k++) {
            const m = masCercano(siguiente.r, xy[k]);
            if (m.dist <= TOCA_RUTA_M && m.loc < siguiente.hasta - MIN &&
                (!anterior || m.loc >= 0)) {
              fin = k;
              siguiente.desde = m.loc;
              break;
            }
          }
        }

        if (anterior) {
          for (let k = fin; k >= 0; k--) {
            const m = masCercano(anterior.r, xy[k]);
            if (m.dist <= TOCA_RUTA_M && m.loc > anterior.desde + MIN) {
              inicio = k;
              anterior.hasta = m.loc;
              break;
            }
          }
        }

        return { coords: c.coords.slice(inicio, fin + 1) };
      });
    }

    // Punto de la ruta más cercano a p, respetando que quede dentro de [min, max]
    function locCercano(ruta, p, min, max) {
      const m = masCercano(ruta, aXY(...p));
      return (m.loc >= min && m.loc <= max) ? m.loc : null;
    }

    // Recalcula subidas, bajadas y caminatas de una opción usando las calles.
    // Devuelve false si el servicio no respondió (se mantiene la línea recta).
    async function optimizarConCalles(o) {
      const T = o.tramos, n = T.length;
      const MIN = VIAJE.TRAMO_MIN_M;

      // 1) Caminatas iniciales (con las subidas/bajadas estimadas en línea recta)
      let caminos = await Promise.all(tramosAPie(o).map(([a, b]) => caminataPorCalles(a, b)));
      if (!caminos.every(Boolean)) return false;

      // 2) Subida: punto de la ruta más cercano a donde A entra a la red de calles
      const entradaA = caminos[0].coords[0];
      const nuevaSubida = locCercano(T[0].r, entradaA, 0, T[0].hasta - MIN);
      let recalcular = false;
      if (nuevaSubida !== null && Math.abs(nuevaSubida - T[0].desde) > 30) {
        T[0].desde = nuevaSubida;
        recalcular = true;
      }

      // 3) Bajada: punto de la ruta más cercano a donde B entra a la red de calles
      const ultimo = caminos[caminos.length - 1];
      const entradaB = ultimo.coords[ultimo.coords.length - 1];
      const t = T[n - 1];
      const nuevaBajada = locCercano(t.r, entradaB, t.desde + MIN, t.r.largo);
      if (nuevaBajada !== null && Math.abs(nuevaBajada - t.hasta) > 30) {
        t.hasta = nuevaBajada;
        recalcular = true;
      }

      // 4) Si cambió la subida o la bajada, pedir de nuevo esas caminatas
      if (recalcular) {
        caminos = await Promise.all(tramosAPie(o).map(([a, b]) => caminataPorCalles(a, b)));
        if (!caminos.every(Boolean)) return false;
      }

      // 5) Subir/bajar donde la caminata realmente toca la ruta
      o.caminos = cortarDondeTocaRuta(o, caminos);

      // Metros = desde el punto (A / bajada) hasta la calle, por las calles, y hasta el bus/destino
      o.caminatas = tramosAPie(o).map(([a, b], i) => largoCamino([a, ...o.caminos[i].coords, b]));
      return true;
    }

    function recalcularTotales(o) {
      o.metrosBus = o.tramos.reduce((s, t) => s + (t.hasta - t.desde), 0);
      o.metrosCamina = o.caminatas.reduce((a, b) => a + b, 0);
      o.minutos = o.metrosCamina / VIAJE.CAMINA_M_MIN
                + o.metrosBus / VIAJE.BUS_M_MIN
                + (o.tramos.length - 1) * VIAJE.TRANSBORDO_MIN;
    }

    // Reemplaza las estimaciones en línea recta por caminatas reales por calles
    async function mejorarCaminatas() {
      const token = viaje.token;
      viaje.calculandoCalles = true;
      renderizarViaje();

      const elegidaAntes = viaje.opciones[viaje.elegida];
      // Primero la opción elegida (se dibuja apenas está lista), luego las demás
      const orden = [elegidaAntes, ...viaje.opciones.filter(o => o !== elegidaAntes)];

      for (const o of orden) {
        const ok = await optimizarConCalles(o);
        if (token !== viaje.token) return; // el viaje cambió mientras tanto
        o.porCalles = ok;
        if (!ok) o.caminos = null;
        recalcularTotales(o);
        if (o === elegidaAntes) dibujarOpcion(viaje.opciones.indexOf(o), false);
      }

      // Si se puede ir caminando, también por calles
      if (viaje.caminando) {
        const c = await caminataPorCalles([viaje.origen.lat, viaje.origen.lng], [viaje.destino.lat, viaje.destino.lng]);
        if (token !== viaje.token) return;
        if (c) viaje.caminando = c.metros;
      }

      // Reordenar con los tiempos reales, manteniendo la opción elegida
      viaje.opciones.sort((a, b) => a.minutos - b.minutos);
      viaje.elegida = viaje.usuarioEligio ? viaje.opciones.indexOf(elegidaAntes) : 0;
      viaje.calculandoCalles = false;
      renderizarViaje();
      dibujarOpcion(viaje.elegida, false);
    }

    function renderizarViaje() {
      const { opciones, elegida, caminando } = viaje;

      const avisoCaminando = caminando
        ? `<div class="viaje-aviso"><i class="fa-solid fa-person-walking"></i>
             Está a ${fmtMetros(caminando)}: caminando son unos ${fmtMin(caminando / VIAJE.CAMINA_M_MIN)}.</div>`
        : '';

      if (!opciones.length) {
        resultadosViaje.innerHTML = `${avisoCaminando}
          <p class="nota" style="margin:0">
            No encontramos un recorrido con hasta 1 transbordo y caminatas de hasta ${VIAJE.CAMINATA_MAX_M} m.
          </p>`;
        resultadosViaje.hidden = false;
        return;
      }

      const lista = opciones.map((o, i) => `
        <button class="opcion-viaje ${i === elegida ? 'activo' : ''}" data-i="${i}" aria-pressed="${i === elegida}">
          <div class="opcion-viaje-cabecera">
            <div class="opcion-viaje-lineas">
              ${o.tramos.map(t => chipLinea(t.r.linea)).join('<i class="fa-solid fa-chevron-right separador"></i>')}
            </div>
            <span class="opcion-viaje-tiempo">≈ ${fmtMin(o.minutos)}</span>
          </div>
          <div class="opcion-viaje-detalle">
            ${i === 0 && opciones.length > 1 ? '<span class="insignia">Más rápida</span>' : ''}
            ${o.tramos.length === 1 ? 'Directo' : '1 transbordo'} ·
            <i class="fa-solid fa-person-walking"></i> ${fmtMetros(o.metrosCamina)} ·
            <i class="fa-solid fa-bus"></i> ${fmtMetros(o.metrosBus)}
          </div>
        </button>
      `).join('');

      const o = opciones[elegida];

      resultadosViaje.innerHTML = `
        ${avisoCaminando}

        <div class="viaje-seccion-titulo">
          <span><i class="fa-solid fa-list"></i> Opciones de viaje</span>
          <span class="contador">${opciones.length}</span>
        </div>
        <div class="opciones-viaje">${lista}</div>

        <button class="ver-mas-viaje" onclick="togglePanel(true)">
          <i class="fa-solid fa-chevron-up"></i> Ver pasos${opciones.length > 1 ? ' y otras opciones' : ''}
        </button>

        <section class="viaje-detalle" aria-label="Detalle del viaje">
          <div class="viaje-seccion-titulo">
            <span><i class="fa-solid fa-route"></i> Detalle del viaje</span>
            <span class="opcion-viaje-tiempo">${viaje.calculandoCalles
              ? '<i class="fa-solid fa-circle-notch fa-spin cargando-calles" title="Calculando caminata por calles"></i>'
              : ''}≈ ${fmtMin(o.minutos)}</span>
          </div>
          <div class="opcion-viaje-lineas">
            ${o.tramos.map(t => chipLinea(t.r.linea)).join('<i class="fa-solid fa-chevron-right separador"></i>')}
          </div>
          ${htmlPasos(o)}
        </section>

        <p class="nota">${viaje.calculandoCalles
          ? 'Calculando la caminata por calles…'
          : o.porCalles
            ? 'Caminata calculada por calles (OpenStreetMap). Bus estimado a 18 km/h, sin contar la espera.'
            : 'Caminata estimada en línea recta (no se pudo calcular por calles). Bus a 18 km/h, sin contar la espera.'}</p>
      `;
      resultadosViaje.hidden = false;
    }

    // ----- Dibujo en el mapa -----
    function iconoPin(letra) {
      return L.divIcon({
        className: '',
        html: `<div class="pin-viaje pin-${letra.toLowerCase()} pin-mapa">${letra}</div>`,
        iconSize: [26, 26],
        iconAnchor: [13, 13]
      });
    }

    // Pin A o B que se puede arrastrar para ajustar la ubicación exacta
    function crearPin(cual) {
      const p = viaje[cual];
      const pin = L.marker([p.lat, p.lng], {
        icon: iconoPin(cual === 'origen' ? 'A' : 'B'),
        pane: 'pane_busqueda',
        draggable: true,
        autoPan: true
      }).bindTooltip(
        `${escaparHTML(p.titulo)}<br><span class="sub-tooltip">Arrastre para ajustar</span>`,
        { direction: 'top', offset: [0, -12] }
      );
      pin.on('dragend', () => fijarPunto(cual, pin.getLatLng(), false));
      return pin;
    }

    function dibujarOpcion(i, encuadrar = true) {
      capaViaje.clearLayers();
      const { origen, destino } = viaje;
      if (!origen || !destino) return;

      const pinA = crearPin('origen');
      const pinB = crearPin('destino');

      const o = viaje.opciones[i];
      const limites = [[origen.lat, origen.lng], [destino.lat, destino.lng]];

      if (o) {
        // Caminata k-ésima: por calles si ya llegó, si no en línea recta (más tenue)
        let k = 0;
        const estiloCalle = {
          pane: 'pane_busqueda', color: '#374151', weight: 3, dashArray: '2 7',
          lineCap: 'round', lineJoin: 'round', interactive: false
        };
        // Tramo sin calle mapeada (p. ej. dentro de un campus): más fino y tenue
        const estiloSinCalle = { ...estiloCalle, weight: 2, opacity: 0.45, dashArray: '1 6' };

        const caminata = (a, b) => {
          const c = o.caminos && o.caminos[k++];
          if (!c || !c.coords.length) {
            L.polyline([a, b], { ...estiloCalle, opacity: 0.5 }).addTo(capaViaje);
            return;
          }
          const ini = c.coords[0], fin = c.coords[c.coords.length - 1];
          L.polyline([a, ini], estiloSinCalle).addTo(capaViaje);   // desde el punto hasta la calle
          L.polyline(c.coords, estiloCalle).addTo(capaViaje);      // por las calles
          L.polyline([fin, b], estiloSinCalle).addTo(capaViaje);   // desde la calle hasta el bus/destino
        };

        let anterior = [origen.lat, origen.lng];
        o.tramos.forEach(t => {
          const coords = tramoEntre(t.r, t.desde, t.hasta);
          const color = coloresLineas[t.r.linea] || '#666';
          caminata(anterior, coords[0]);
          L.polyline(coords, { pane: 'pane_busqueda', color: '#ffffff', weight: 11, opacity: 0.95, interactive: false }).addTo(capaViaje);
          const tramo = L.polyline(coords, { pane: 'pane_busqueda', color: oscurecerColor(color, 10), weight: 7, interactive: false }).addTo(capaViaje);
          L.polylineDecorator(tramo, {
            patterns: [{
              offset: 40, repeat: 90,
              symbol: L.Symbol.arrowHead({
                pixelSize: 9, polygon: false,
                pathOptions: { pane: 'pane_busqueda', color: '#ffffff', weight: 2.5, opacity: 1, interactive: false }
              })
            }]
          }).addTo(capaViaje);

          [[coords[0], 'Sube a la'], [coords[coords.length - 1], 'Baja de la']].forEach(([pt, texto]) => {
            L.circleMarker(pt, { pane: 'pane_busqueda', radius: 6, color, weight: 3, fillColor: '#fff', fillOpacity: 1 })
              .bindTooltip(`${texto} ${escaparHTML(t.r.linea)}`, { direction: 'top', offset: [0, -6] })
              .addTo(capaViaje);
          });

          limites.push(...coords);
          anterior = coords[coords.length - 1];
        });
        caminata(anterior, [destino.lat, destino.lng]);
        (o.caminos || []).forEach(c => { if (c) limites.push(...c.coords); });

        // Atenuar todas las rutas: lo que importa es el tramo dibujado
        destacarLinea([]);
      } else {
        quitarDestacado();
      }

      pinA.addTo(capaViaje);
      pinB.addTo(capaViaje);

      if (!encuadrar) return;
      const abajo = esMovil()
        ? parseInt(getComputedStyle(document.documentElement).getPropertyValue('--alto-mini')) + 20 || 200
        : 40;
      const izquierda = !esMovil() && !document.body.classList.contains('panel-oculto') ? 320 : 40;
      map.fitBounds(limites, { paddingTopLeft: [izquierda, 40], paddingBottomRight: [40, abajo], maxZoom: 16 });
    }

    function calcularViaje(encuadrar = true) {
      const { origen, destino } = viaje;
      viaje.token++;
      viaje.calculandoCalles = false;
      viaje.opciones = [];
      viaje.elegida = 0;
      viaje.caminando = 0;
      capaViaje.clearLayers();

      if (!origen || !destino) {
        resultadosViaje.hidden = true;
        if (origen || destino) crearPin(origen ? 'origen' : 'destino').addTo(capaViaje);
        return;
      }

      const resultado = calcularOpciones(origen, destino);
      if (!resultado) {
        resultadosViaje.innerHTML = '<p class="nota" style="margin:0">Cargando recorridos, intente en unos segundos…</p>';
        resultadosViaje.hidden = false;
        return;
      }

      viaje.opciones = resultado.opciones;
      viaje.usuarioEligio = false;
      if (resultado.distanciaDirecta <= 800) viaje.caminando = resultado.distanciaDirecta;
      viaje.token++;
      if (viaje.opciones.length || viaje.caminando) setTimeout(mejorarCaminatas, 120);

      renderizarViaje();
      if (encuadrar) colapsarEnMovil();
      // Esperar a que el panel termine de cambiar de tamaño antes de encuadrar
      setTimeout(() => dibujarOpcion(0, encuadrar), 80);
    }

    resultadosViaje.addEventListener('click', e => {
      const btn = e.target.closest('.opcion-viaje');
      if (!btn) return;
      viaje.elegida = +btn.dataset.i;
      viaje.usuarioEligio = true;
      renderizarViaje();
      dibujarOpcion(viaje.elegida);
    });

    function invertirViaje() {
      [viaje.origen, viaje.destino] = [viaje.destino, viaje.origen];
      const o = document.getElementById('viaje-origen');
      const d = document.getElementById('viaje-destino');
      [o.value, d.value] = [d.value, o.value];
      calcularViaje();
    }

    // ----- Autocompletado para origen y destino -----
    function crearAutocompletar(input, lista, alElegir, alBorrar) {
      let resultados = [], activo = -1, temporizador = null, peticion = null;

      const pintar = (items, vacio) => {
        resultados = items;
        activo = -1;
        lista.innerHTML = items.length
          ? items.map((r, i) => `
              <li role="option" data-i="${i}">
                ${escaparHTML(r.titulo)}
                ${r.sub ? `<span class="sub">${escaparHTML(r.sub)}</span>` : ''}
              </li>`).join('')
          : `<li class="vacio">${vacio}</li>`;
        lista.hidden = false;
      };
      const cerrar = () => { lista.hidden = true; activo = -1; };
      const elegir = r => {
        cerrar();
        input.value = r.titulo;
        input.blur();
        alElegir(r);
      };

      input.addEventListener('input', () => {
        const texto = input.value.trim();
        clearTimeout(temporizador);
        if (peticion) peticion.abort();
        alBorrar(); // el texto cambió: el punto elegido ya no vale

        if (texto.length < 3) { cerrar(); return; }

        if (lista.hidden || !resultados.length) {
          resultados = [];
          lista.innerHTML = `<li class="vacio cargando-fila"><i class="fa-solid fa-circle-notch fa-spin"></i> Buscando en Copiapó…</li>`;
          lista.hidden = false;
        }
        temporizador = setTimeout(async () => {
          peticion = new AbortController();
          try {
            pintar(await consultarLugares(texto, peticion.signal), 'Sin resultados en Copiapó');
          } catch (err) {
            if (err.name !== 'AbortError') pintar([], 'No se pudo buscar. Intente de nuevo.');
          }
        }, 350);
      });

      input.addEventListener('keydown', e => {
        const n = resultados.length;
        const marcar = () => lista.querySelectorAll('li[data-i]')
          .forEach((li, i) => li.classList.toggle('activo', i === activo));
        if (e.key === 'ArrowDown' && n && !lista.hidden) { e.preventDefault(); activo = (activo + 1) % n; marcar(); }
        else if (e.key === 'ArrowUp' && n && !lista.hidden) { e.preventDefault(); activo = (activo - 1 + n) % n; marcar(); }
        else if (e.key === 'Enter' && n && !lista.hidden) { e.preventDefault(); elegir(resultados[Math.max(activo, 0)]); }
        else if (e.key === 'Escape') cerrar();
      });

      lista.addEventListener('click', e => {
        const li = e.target.closest('li[data-i]');
        if (li) elegir(resultados[+li.dataset.i]);
      });

      document.addEventListener('click', e => {
        if (!e.target.closest('.viaje-fila') && !lista.contains(e.target)) cerrar();
      });
    }

    crearAutocompletar(
      document.getElementById('viaje-origen'),
      document.getElementById('viaje-origen-lista'),
      r => { viaje.origen = r; calcularViaje(); },
      () => { if (viaje.origen) { viaje.origen = null; calcularViaje(); } }
    );
    crearAutocompletar(
      document.getElementById('viaje-destino'),
      document.getElementById('viaje-destino-lista'),
      r => { viaje.destino = r; calcularViaje(); },
      () => { if (viaje.destino) { viaje.destino = null; calcularViaje(); } }
    );

    // ----- Elegir origen/destino tocando el mapa -----

    let eligiendo = null;          // 'origen' | 'destino' | null
    let ignorarClicHasta = 0;
    const avisoMapa = document.getElementById('aviso-mapa');

    function elegirEnMapa(cual) {
      if (eligiendo === cual) { cancelarEleccion(); return; }
      eligiendo = cual;
      document.body.classList.add('eligiendo-punto');
      document.querySelectorAll('.boton-elegir').forEach(b =>
        b.classList.toggle('activo', b.dataset.elegir === cual));
      document.getElementById('aviso-mapa-texto').textContent =
        `${ES_TACTIL ? 'Toque' : 'Haga clic en'} el mapa para fijar el ${cual === 'origen' ? 'origen (A)' : 'destino (B)'}`;
      avisoMapa.hidden = false;
      colapsarEnMovil();
    }

    function cancelarEleccion() {
      eligiendo = null;
      document.body.classList.remove('eligiendo-punto');
      document.querySelectorAll('.boton-elegir').forEach(b => b.classList.remove('activo'));
      avisoMapa.hidden = true;
    }

    // Guarda un punto puesto a mano (clic o arrastre) y recalcula el viaje
    function fijarPunto(cual, latlng, encuadrar) {
      const p = { titulo: 'Punto en el mapa', sub: '', lat: latlng.lat, lng: latlng.lng };
      viaje[cual] = p;
      document.getElementById(cual === 'origen' ? 'viaje-origen' : 'viaje-destino').value = p.titulo;
      nombrarPunto(cual, p);
      // Encuadrar solo cuando se completa el par
      calcularViaje(encuadrar && !!(viaje.origen && viaje.destino));
    }

    // Busca el nombre de la calle más cercana (sin bloquear el cálculo)
    async function nombrarPunto(cual, p) {
      try {
        const resp = await fetch('https://photon.komoot.io/reverse?' +
          new URLSearchParams({ lat: p.lat, lon: p.lng, limit: 1 }));
        const f = (await resp.json()).features[0];
        const nombre = f && (f.properties.street || f.properties.name);
        if (!nombre || viaje[cual] !== p) return; // el punto ya cambió
        p.titulo = `Cerca de ${nombre}`;
        document.getElementById(cual === 'origen' ? 'viaje-origen' : 'viaje-destino').value = p.titulo;
        capaViaje.eachLayer(l => {
          if (l instanceof L.Marker && l.getLatLng().lat === p.lat && l.getLatLng().lng === p.lng) {
            l.setTooltipContent(`${escaparHTML(p.titulo)}<br><span class="sub-tooltip">Arrastre para ajustar</span>`);
          }
        });
      } catch (e) { /* sin nombre: queda "Punto en el mapa" */ }
    }

    // Capturar el toque/clic antes que las capas (así no se abren fichas de UV)
    (() => {
      const cont = map.getContainer();
      let inicio = null;

      cont.addEventListener('pointerdown', e => {
        inicio = eligiendo ? { x: e.clientX, y: e.clientY, t: Date.now() } : null;
      }, true);

      cont.addEventListener('pointerup', e => {
        if (!eligiendo || !inicio) return;
        const movio = Math.hypot(e.clientX - inicio.x, e.clientY - inicio.y) > 10;
        const largo = Date.now() - inicio.t > 700;
        inicio = null;
        if (movio || largo) return; // fue un arrastre del mapa
        if (e.target.closest('.leaflet-control')) return;

        const cual = eligiendo;
        const latlng = map.mouseEventToLatLng(e);
        cancelarEleccion();
        ignorarClicHasta = Date.now() + 500;
        fijarPunto(cual, latlng, true);
      }, true);

      // Evitar que ese mismo clic abra la ficha de una UV o una ruta
      cont.addEventListener('click', e => {
        if (eligiendo || Date.now() < ignorarClicHasta) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      }, true);
    })();

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && eligiendo) cancelarEleccion();
    });

    // ----- Usar mi ubicación como origen -----
    function usarMiUbicacion() {
      const input = document.getElementById('viaje-origen');
      if (!navigator.geolocation) {
        resultadosViaje.innerHTML = '<p class="nota" style="margin:0">Su navegador no permite obtener la ubicación.</p>';
        resultadosViaje.hidden = false;
        return;
      }
      input.value = 'Obteniendo ubicación…';
      navigator.geolocation.getCurrentPosition(
        pos => {
          const { latitude: lat, longitude: lng } = pos.coords;
          const [oeste, sur, este, norte] = BBOX_COPIAPO;
          if (lng < oeste || lng > este || lat < sur || lat > norte) {
            input.value = '';
            resultadosViaje.innerHTML = '<p class="nota" style="margin:0">Su ubicación está fuera de Copiapó. Escriba el origen manualmente.</p>';
            resultadosViaje.hidden = false;
            return;
          }
          input.value = 'Mi ubicación';
          viaje.origen = { titulo: 'Mi ubicación', sub: '', lat, lng };
          calcularViaje();
        },
        () => {
          input.value = '';
          resultadosViaje.innerHTML = '<p class="nota" style="margin:0">No se pudo obtener su ubicación (permiso denegado o sin señal).</p>';
          resultadosViaje.hidden = false;
        },
        { enableHighAccuracy: true, timeout: 10000 }
      );
    }


    // ======================
    // EJECUTAR
    // ======================

    cargarCapas();

  </script>

</body>
