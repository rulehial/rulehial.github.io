<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Ruta Buses - Copiapó</title>
  <meta property="og:title" content="Ruta Buses - Copiapó" />

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
  <!-- Font Awesome (íconos) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>

  <style>
    :root {
      --texto: #1f2937;
      --texto-suave: #6b7280;
      --borde: #e5e7eb;
      --hover: #f3f4f6;
      --acento: #2563eb;
      --fondo-panel: rgba(255, 255, 255, 0.97);
      --sombra: 0 4px 20px rgba(0, 0, 0, 0.15);
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--texto);
      background: #f2efe9;
    }

    .leaflet-container {
      font-family: inherit;
    }

    /* Mapa base en gris claro para que destaquen las rutas */
    .leaflet-tile-pane {
      filter: grayscale(1) brightness(1.08) contrast(0.85);
    }

    #map {
      width: 100%;
      height: 100vh;
    }

    /* ======================
       PANEL LATERAL
       ====================== */

    #panel {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 1000;
      width: 290px;
      max-height: calc(100vh - 24px);
      display: flex;
      flex-direction: column;
      background: var(--fondo-panel);
      border-radius: 12px;
      box-shadow: var(--sombra);
      overflow: hidden;
      transition: transform 0.3s ease, opacity 0.3s ease;
    }

    body.panel-oculto #panel {
      transform: translateX(calc(-100% - 24px));
      opacity: 0;
      pointer-events: none;
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 14px 12px 14px 16px;
      border-bottom: 1px solid var(--borde);
    }

    .panel-marca {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .panel-icono {
      display: grid;
      place-items: center;
      width: 36px;
      height: 36px;
      border-radius: 9px;
      background: #eff6ff;
      color: var(--acento);
      font-size: 16px;
      flex-shrink: 0;
    }

    .panel-header h1 {
      margin: 0;
      font-size: 16px;
      font-weight: 700;
      line-height: 1.25;
    }

    .panel-header p {
      margin: 2px 0 0;
      font-size: 12.5px;
      color: var(--texto-suave);
    }

    .panel-contenido {
      overflow-y: auto;
      flex: 1;
    }

    .seccion {
      border-bottom: 1px solid var(--borde);
    }

    .seccion:last-child {
      border-bottom: none;
    }

    .seccion-titulo {
      all: unset;
      box-sizing: border-box;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--texto-suave);
      cursor: pointer;
    }

    .seccion-titulo:hover {
      color: var(--texto);
    }

    .seccion-titulo:focus-visible,
    .boton-icono:focus-visible,
    .boton-flotante:focus-visible {
      outline: 2px solid var(--acento);
      outline-offset: -2px;
    }

    .chevron {
      font-size: 10px;
      transition: transform 0.2s ease;
    }

    .seccion.cerrada .chevron {
      transform: rotate(-90deg);
    }

    .seccion-cuerpo {
      padding: 0 16px 14px;
      font-size: 13px;
    }

    .seccion.cerrada .seccion-cuerpo {
      display: none;
    }

    .opcion {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 0;
      cursor: pointer;
    }

    .opcion input {
      margin: 0;
      accent-color: var(--acento);
      cursor: pointer;
    }

    .icono-capa {
      width: 16px;
      text-align: center;
      font-size: 13px;
      color: var(--color-capa);
      transition: color 0.2s ease;
    }

    /* Capa apagada: ícono en gris */
    .opcion input:not(:checked) + .icono-capa {
      color: #c4c9d0;
    }

    .opcion-todas {
      font-weight: 600;
      padding-bottom: 8px;
      margin-bottom: 6px;
      border-bottom: 1px solid var(--borde);
    }

    .grilla-lineas {
      display: grid;
      grid-template-columns: 1fr 1fr;
      column-gap: 8px;
    }

    .muestra-linea {
      width: 18px;
      height: 5px;
      border-radius: 3px;
      flex-shrink: 0;
    }

    .muestra-area {
      width: 16px;
      height: 16px;
      border-radius: 4px;
      opacity: 0.6;
      border: 1px solid rgba(0, 0, 0, 0.08);
      flex-shrink: 0;
    }

    .leyenda-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 3px 0;
    }

    .nota {
      margin: 8px 0 0;
      font-size: 11px;
      color: var(--texto-suave);
    }

    .selector {
      width: 100%;
      font: inherit;
      font-size: 13px;
      padding: 7px 10px;
      border: 1px solid var(--borde);
      border-radius: 8px;
      background: #fff;
      color: var(--texto);
      cursor: pointer;
    }

    /* ======================
       BUSCADOR DE CALLES
       ====================== */

    .buscador {
      padding: 12px 16px;
      border-bottom: 1px solid var(--borde);
    }

    .buscador-campo {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0 4px 0 10px;
      border: 1px solid var(--borde);
      border-radius: 8px;
      background: #fff;
    }

    .buscador-campo:focus-within {
      border-color: var(--acento);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    .buscador-lupa {
      font-size: 13px;
      color: var(--texto-suave);
    }

    .buscador-campo input {
      flex: 1;
      min-width: 0;
      border: none;
      outline: none;
      padding: 8px 0;
      font: inherit;
      font-size: 13px;
      color: var(--texto);
      background: transparent;
    }

    .buscador-campo input::-webkit-search-cancel-button {
      display: none;
    }

    .boton-limpiar {
      width: 26px;
      height: 26px;
      font-size: 13px;
    }

    .buscador-resultados {
      list-style: none;
      margin: 6px 0 0;
      padding: 4px;
      border: 1px solid var(--borde);
      border-radius: 8px;
      max-height: 260px;
      overflow-y: auto;
    }

    .buscador-resultados li {
      padding: 7px 8px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      line-height: 1.3;
    }

    .buscador-resultados li:hover,
    .buscador-resultados li.activo {
      background: var(--hover);
    }

    .buscador-resultados .sub {
      display: block;
      font-size: 11.5px;
      color: var(--texto-suave);
    }

    .buscador-resultados li.vacio {
      cursor: default;
      color: var(--texto-suave);
    }

    .buscador-info {
      margin-top: 10px;
      font-size: 13px;
    }

    .buscador-info .lugar {
      font-weight: 600;
    }

    .buscador-info .lugar i {
      color: var(--acento);
      margin-right: 4px;
    }

    .buscador-info .etiqueta {
      margin: 8px 0 6px;
      font-size: 11.5px;
      color: var(--texto-suave);
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 9px;
      border: 1px solid var(--borde);
      border-radius: 999px;
      font: inherit;
      font-size: 12px;
      color: var(--texto);
      background: #fff;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .chip:hover {
      background: var(--hover);
      border-color: var(--color-linea);
    }

    .chip:focus-visible {
      outline: 2px solid var(--acento);
      outline-offset: 1px;
    }

    .chip.activo {
      border-color: var(--color-linea);
      box-shadow: inset 0 0 0 1px var(--color-linea);
      font-weight: 600;
    }

    .boton-icono {
      all: unset;
      display: grid;
      place-items: center;
      width: 30px;
      height: 30px;
      border-radius: 8px;
      font-size: 18px;
      color: var(--texto-suave);
      cursor: pointer;
      flex-shrink: 0;
    }

    .boton-icono:hover {
      background: var(--hover);
      color: var(--texto);
    }

    .boton-flotante {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 1000;
      width: 42px;
      height: 42px;
      border: none;
      border-radius: 10px;
      background: #fff;
      box-shadow: var(--sombra);
      font-size: 18px;
      color: var(--texto);
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .boton-flotante:hover {
      background: var(--hover);
    }

    body.panel-oculto .boton-flotante {
      opacity: 1;
      pointer-events: auto;
    }

    .small{
      color: #aaa;
    }

    .label-uv {
      background: transparent;
      border: none;
      box-shadow: none;
      font-size: 12px;
      font-weight: 600;
      color: #666;
      -webkit-text-stroke: 0.01em #fff;
      text-align: center;
    }

    .tooltip-buses {
      z-index: 9999 !important;
      background: white;
      border: none;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 13px;
      line-height: 1.45;
      color: var(--texto);
      box-shadow: var(--sombra);
    }

    .leaflet-popup-content-wrapper {
      border-radius: 10px;
      box-shadow: var(--sombra);
    }

    .leaflet-popup-content {
      font-size: 13px;
      line-height: 1.45;
    }

    path:focus {
      outline: none;
    }

    .leaflet-interactive {
      transition:
        opacity 0.3s ease,
        stroke-width 0.3s ease,
        fill-opacity 0.3s ease;
    }

    .linea-base {
      stroke-linejoin: round;
      stroke-linecap:  round;
      paint-order:     stroke fill;
      -webkit-text-stroke: 0;
      filter: drop-shadow(0px 0px 0.1px rgb(97, 95, 95));
    }

    .linea-sin-sombra {
      filter: none !important;
    }

    .linea-animada {
      animation: dibujarLinea 1s linear forwards;
    }
    @keyframes dibujarLinea {
      to {
        stroke-dashoffset: 0;
      }
    }

      .leaflet-control-zoom {
        display: none;
      }

    @media (max-width: 768px) {
      #panel {
        top: 8px;
        left: 8px;
        right: 8px;
        width: auto;
        max-height: calc(100vh - 16px);
      }

      .boton-flotante {
        top: 8px;
        left: 8px;
      }
    }

      
  </style>
</head>
<body>

  <!-- Botón para volver a mostrar el panel -->
  <button id="abrir-panel" class="boton-flotante" onclick="togglePanel(true)" aria-label="Mostrar panel" title="Mostrar panel"><i class="fa-solid fa-bars"></i></button>

  <!-- Panel lateral -->
  <aside id="panel">

    <header class="panel-header">
      <div class="panel-marca">
        <span class="panel-icono"><i class="fa-solid fa-bus"></i></span>
        <div>
          <h1>Recorridos Autobuses</h1>
          <p>Comuna de Copiapó</p>
        </div>
      </div>
      <button class="boton-icono" onclick="togglePanel(false)" aria-label="Ocultar panel" title="Ocultar panel"><i class="fa-solid fa-angles-left"></i></button>

    <!-- Buscador de calles (solo Copiapó) -->
    <div class="buscador">

        <input

          aria-controls="buscador-resultados"
        >
        <button id="buscar-limpiar" class="boton-icono boton-limpiar" onclick="limpiarBusqueda()" aria-label="Limpiar búsqueda" title="Limpiar búsqueda" hidden><i class="fa-solid fa-xmark"></i></button>
      </div>
      <ul id="buscador-resultados" class="buscador-resultados" role="listbox" hidden></ul>

    <div class="panel-contenido">

      <section class="seccion">
        <button class="seccion-titulo" onclick="toggleSeccion(this)" aria-expanded="true">

        <div class="seccion-cuerpo">
          <label class="opcion">

            Unidades Vecinales
          </label>
          <label class="opcion">
            <input type="checkbox" class="check-capa" data-capa="Recorridos Buses" checked onchange="toggleCapa('Recorridos Buses', this.checked)">
            <i class="fa-solid fa-route icono-capa" style="--color-capa:#59a14f" aria-hidden="true"></i>
            Recorridos Buses
          </label>
          <label class="opcion">
            <input type="checkbox" class="check-capa" data-capa="Manzanas" checked onchange="toggleCapa('Manzanas', this.checked)">
            <i class="fa-solid fa-city icono-capa" style="--color-capa:#e0715a" aria-hidden="true"></i>
            Manzanas
          </label>
        </div>
      </section>

      <section class="seccion">
        <button class="seccion-titulo" onclick="toggleSeccion(this)" aria-expanded="true">
          Filtrar por UV <i class="fa-solid fa-chevron-down chevron" aria-hidden="true"></i>
        </button>
        <div class="seccion-cuerpo">

      <section class="seccion">

        </button>
        <div class="seccion-cuerpo">

      <section class="seccion cerrada">
        <button class="seccion-titulo" onclick="toggleSeccion(this)" aria-expanded="false">
          Habitantes por manzana <i class="fa-solid fa-chevron-down chevron" aria-hidden="true"></i>
        </button>
        <div class="seccion-cuerpo">
          <div id="leyenda-manzanas"></div>
          <p class="nota">Según Censo 2024</p>
        </div>
      </section>

    </div>
  </aside>

  <!-- Mapa -->
  <div id="map"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <!-- Decorador de líneas para animación -->
  <script src="https://unpkg.com/leaflet-polylinedecorator/dist/leaflet.polylineDecorator.js"></script>
  <!-- Turf.js para cálculos geoespaciales -->
  <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>
  

  <script>

    // Crear mapa
    const map = L.map('map', { doubleClickZoom: false}).setView([-27.3708, -70.3203], 14);
    // Cancelar animaciones en curso al hacer zoom
    map.on('zoomstart', function() {

      Object.values(capasLineas).forEach(layers => {
        layers.forEach(layer => {

          if (layer._animando) {

            const el = layer.getElement();

            if (el) {
              // Congelar en la posición actual antes de que el SVG se destruya
              el.classList.remove('linea-animada');
              el.style.strokeDashoffset = 0;
              el.style.strokeDasharray  = 'none';
            }

            layer._animando = false;
          }

        });
      });

    });

    // Base map
    L.tileLayer(
      'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
      {
        maxZoom: 19,
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
      }
    ).addTo(map);

    // Estilo polígonos
    function estilo(feature) {
      return {
        fillColor: '#2E86DE',
        weight: 1,
        opacity: 1,
        color: 'white',
        fillOpacity: 0.6
      };
    }

    // Hover
    function highlightFeature(e) {
      const layer = e.target;

      layer.setStyle({
        weight: 3,
        color: '#000',
        fillOpacity: 0.8
      });

      layer.bringToFront();
    }

    // Restaurar estilo
    function resetHighlight(e) {
      geojson.resetStyle(e.target);
    }

    // Eventos y popup
    function onEachFeature(feature, layer) {

      layer.on({
        mouseover: highlightFeature,
        mouseout: resetHighlight
      });

      layer.bindPopup(`
        <b>Unidad Vecinal:</b><br>
        ${feature.properties.NOMBRE || 'Sin nombre'}
      `);
    }



    function oscurecerColor(hex, porcentaje = 20) {

      hex = hex.replace('#', '');

      let r = parseInt(hex.substring(0,2), 16);
      let g = parseInt(hex.substring(2,4), 16);
      let b = parseInt(hex.substring(4,6), 16);

      r = Math.floor(r * (100 - porcentaje) / 100);
      g = Math.floor(g * (100 - porcentaje) / 100);
      b = Math.floor(b * (100 - porcentaje) / 100);

      r = r.toString(16).padStart(2, '0');
      g = g.toString(16).padStart(2, '0');
      b = b.toString(16).padStart(2, '0');

      return `#${r}${g}${b}`;
    }

    function getColorManzana(valor) {

      if (valor <= binsManzanas[0]) {
        return coloresManzanas[0];
      }
      else if (valor <= binsManzanas[1]) {
        return coloresManzanas[1];
      }
      else if (valor <= binsManzanas[2]) {
        return coloresManzanas[2];
      }
      else if (valor <= binsManzanas[3]) {
        return coloresManzanas[3];
      }
      else if (valor <= binsManzanas[4]) {
        return coloresManzanas[4];
      }
      else if (valor <= binsManzanas[5]) {
        return coloresManzanas[5];
      }

      return coloresManzanas[6];
    }

    function sincronizarMaestro() {

      const checks = document.querySelectorAll('.check-linea');
      const total   = checks.length;
      const activas = [...checks].filter(c => c.checked).length;

      const maestro = document.querySelector(
        'input[onchange="toggleTodasLineas(this)"]'
      );

      if (!maestro) return;

      if (activas === 0) {
        maestro.checked       = false;
        maestro.indeterminate = false;
      } else if (activas === total) {
        maestro.checked       = true;
        maestro.indeterminate = false;
      } else {
        maestro.checked       = false;
        maestro.indeterminate = true;
      }
    }

    function sincronizarMaestro() {

      const checks = document.querySelectorAll('.check-linea');
      const total   = checks.length;
      const activas = [...checks].filter(c => c.checked).length;

      const maestro = document.querySelector(
        'input[onchange="toggleTodasLineas(this)"]'
      );

      if (!maestro) return;

      if (activas === 0) {
        maestro.checked       = false;
        maestro.indeterminate = false;
      } else if (activas === total) {
        maestro.checked       = true;
        maestro.indeterminate = false;
      } else {
        maestro.checked       = false;
        maestro.indeterminate = true;
      }
    }


  function toggleLinea(nombreLinea) {

    const layers = capasLineas[nombreLinea];

    if (!layers) return;

    const visible = map.hasLayer(layers[0]);

    layers.forEach(layer => {

      // =========================
      // OCULTAR
      // =========================

      if (visible) {
        const el = layer.getElement();
        if (el) {

          el.style.transition = 'opacity 0.4s ease';
          el.style.opacity = 0;
        }

        setTimeout(() => {
          map.removeLayer(layer);
        }, 400);


   

      }

      // =========================
      // MOSTRAR
      // =========================
      else {

        map.addLayer(layer);

        const elInmediato = layer.getElement();
        if (elInmediato) {
          elInmediato.style.opacity = 0;
        }

        layer._animando = true;

        // Esperar a que el elemento esté en el DOM
        setTimeout(() => {
          const el = layer.getElement();
          if (!el) return;

          // Función que lanza la animación con la longitud correcta
          function lanzarAnimacion() {
            const length = el.getTotalLength();

            // Si la línea está fuera del viewport, getTotalLength puede ser 0
            // En ese caso dejamos la línea visible sin animación
            if (length === 0) {
              el.style.strokeDasharray = 'none';
              el.style.strokeDashoffset = 0;
              el.style.opacity = 1;
              layer._animando = false;
              return;
            }

            el.style.strokeDasharray  = length;
            el.style.strokeDashoffset = length;
            el.style.opacity = 1;

            el.classList.remove('linea-animada');
            void el.offsetWidth;
            el.classList.add('linea-animada');

            setTimeout(() => {
              el.style.strokeDashoffset = 0;
              el.style.strokeDasharray  = 'none';
              el.classList.remove('linea-animada');
              layer._animando = false;
            }, 1000);
          }

          const length = el.getTotalLength();

          if (length > 0) {
            // Línea visible en viewport, animar directo
            lanzarAnimacion();
          } else {
            // Línea fuera del viewport: esperar moveend para recalcular
            el.style.opacity = 1;
            el.style.strokeDasharray  = 'none';

          }

        }, 10);

 

      }

    });

  }

    function filtrarPorUV(nombreUV) {

      if (!nombreUV) {
        // Restaurar todas las líneas
        Object.entries(capasLineas).forEach(([nombre, layers]) => {
          layers.forEach(l => {
            if (!map.hasLayer(l)) map.addLayer(l);
          });
          const chk = document.querySelector(
            `.check-linea[onchange*="'${nombre}'"]`
          );
          if (chk) chk.checked = true;
        });
        sincronizarMaestro();
        return;
      }

      // Obtener polígono de la UV seleccionada
      const featureUV = geojsonUV.features.find(
        f => f.properties.NOMBRE_UV === nombreUV
      );

      if (!featureUV) return;

      const poligonoUV = featureUV;

      // Calcular qué líneas intersectan
      const lineasQueIntersectan = new Set();

      geojsonBuses.features.forEach(feature => {
        try {
          if (turf.booleanIntersects(feature, poligonoUV)) {
            lineasQueIntersectan.add(feature.properties.linea);
          }
        } catch(e) {}
      });

      // Mostrar solo líneas que intersectan, ocultar las demás
      Object.entries(capasLineas).forEach(([nombre, layers]) => {
        const visible = lineasQueIntersectan.has(nombre);
        layers.forEach(l => {
          if (visible && !map.hasLayer(l)) map.addLayer(l);
          if (!visible && map.hasLayer(l)) map.removeLayer(l);
        });

        // Sincronizar checkbox
        const chk = document.querySelector(
          `.check-linea[onchange*="'${nombre}'"]`
        );
        if (chk) chk.checked = visible;
      });

      // actualizarCheckboxes(true)
      sincronizarMaestro();
      return;
    }

    const BBOX_COPIAPO = [-70.42, -27.46, -70.20, -27.28];

    function escaparHTML(texto) {
      return String(texto).replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[c]));
    }

    // Convierte un resultado de Photon en { titulo, sub, lat, lng, extent }
    function formatearResultado(f) {
      const p = f.properties;
      const titulo = p.name
        || [p.street, p.housenumber].filter(Boolean).join(' ')
        || 'Sin nombre';
      const sub = [p.district || p.locality, p.city]
        .filter(Boolean)
        .filter((v, i, arr) => arr.indexOf(v) === i)
        .join(', ');
      return {
        titulo,
        sub,
        lng: f.geometry.coordinates[0],
        lat: f.geometry.coordinates[1],
        extent: p.extent // [oeste, norte, este, sur] (solo calles y áreas)
      };
    }

    function mostrarResultados(lista, mensajeVacio) {
      resultadosBusqueda = lista;
      indiceActivo = -1;

      if (!lista.length) {
        listaResultados.innerHTML = `<li class="vacio">${mensajeVacio}</li>`;
      } else {
        listaResultados.innerHTML = lista.map((r, i) => `
          <li role="option" data-i="${i}">
            ${escaparHTML(r.titulo)}
            ${r.sub ? `<span class="sub">${escaparHTML(r.sub)}</span>` : ''}
          </li>
        `).join('');
      }
      listaResultados.hidden = false;
    }

    function ocultarResultados() {
      listaResultados.hidden = true;
      indiceActivo = -1;
    }

    async function buscarCalle(texto) {
      if (peticionBusqueda) peticionBusqueda.abort();
      peticionBusqueda = new AbortController();

      const url = 'https://photon.komoot.io/api/?' + new URLSearchParams({
        q: texto,
        bbox: BBOX_COPIAPO.join(','),
        limit: 10
      });

      try {
        const resp = await fetch(url, { signal: peticionBusqueda.signal });
        const data = await resp.json();

        // Quitar duplicados (misma calle y mismo sector)
        const vistos = new Set();
        const lista = data.features
          .map(formatearResultado)
          .filter(r => {
            const clave = r.titulo + '|' + r.sub;
            if (vistos.has(clave)) return false;
            vistos.add(clave);
            return true;
          })
          .slice(0, 6);

        mostrarResultados(lista, 'Sin resultados en Copiapó');
      } catch (err) {
        if (err.name === 'AbortError') return;
        mostrarResultados([], 'No se pudo buscar. Intente de nuevo.');
      }
    }

    function resaltarActivo() {
      listaResultados.querySelectorAll('li[data-i]').forEach((li, i) => {
        li.classList.toggle('activo', i === indiceActivo);
        if (i === indiceActivo) li.scrollIntoView({ block: 'nearest' });
      });
    }

    // Líneas cuyo recorrido pasa a menos de DISTANCIA_CERCANA_M del punto
    function lineasCercanas(lat, lng) {
      if (!geojsonBuses) return [];
      const punto = turf.point([lng, lat]);
      const cercanas = new Set();

      geojsonBuses.features.forEach(f => {
        try {
          const d = turf.nearestPointOnLine(f, punto, { units: 'meters' }).properties.dist;
          if (d <= DISTANCIA_CERCANA_M) cercanas.add(f.properties.linea);
        } catch (e) {}
      });

      return [...cercanas].sort(
        (a, b) => parseInt(a.replace(/\D/g, '')) - parseInt(b.replace(/\D/g, ''))
      );
    }

    function seleccionarResultado(r) {
      ocultarResultados();

      })

        .addTo(map);

      // Líneas cercanas
      quitarDestacado();
      const lineas = lineasCercanas(r.lat, r.lng);
      const chips = lineas.length
        ? `<div class="chips">${lineas.map(l => `
            <button class="chip" data-linea="${escaparHTML(l)}" aria-pressed="false"
                    style="--color-linea:${coloresLineas[l] || '#666'}"
                    title="Destacar ${escaparHTML(l)} en el mapa">
              <span class="muestra-linea" style="background:${coloresLineas[l] || '#666'}"></span>${escaparHTML(l)}
            </button>`).join('')}</div>`
        : `<div class="nota" style="margin-top:0">Ninguna línea pasa a menos de ${DISTANCIA_CERCANA_M} m.</div>`;

      infoBusqueda.innerHTML = `
        <div class="lugar"><i class="fa-solid fa-location-dot"></i> ${escaparHTML(r.titulo)}${r.sub ? ', ' + escaparHTML(r.sub) : ''}</div>
        <div class="etiqueta">Líneas a menos de ${DISTANCIA_CERCANA_M} m</div>
        ${chips}
      `;
      infoBusqueda.hidden = false;
    }

    // ----- Destacar una línea desde las etiquetas de "líneas cercanas" -----

    let lineaDestacada = null;

    function aplicarDestacado(nombre) {
      const grupo = overlays['Recorridos Buses'];
      if (!grupo) return;

      grupo.eachLayer(l => {
        grupo.resetStyle(l);
        const el = l.getElement();

        if (l.feature.properties.linea === nombre) {
          l.setStyle({
            weight:  l.options.weight + 2,
            color:   oscurecerColor(l.options.color, 5),
            opacity: 1
          });
          if (el) el.classList.remove('linea-sin-sombra');
          if (map.hasLayer(l)) l.bringToFront();
          (decoradoresCapas.get(l) || []).forEach(d => {
            if (map.hasLayer(l) && !map.hasLayer(d)) d.addTo(map);
          });
        } else {
          l.setStyle({ opacity: 0.15 });
          if (el) el.classList.add('linea-sin-sombra');
          // Quitar flechas de las líneas que no están destacadas
          (decoradoresCapas.get(l) || []).forEach(d => {
            if (map.hasLayer(d)) map.removeLayer(d);
          });
        }
      });

      // Que el marcador de búsqueda quede siempre encima
      if (marcadorBusqueda) marcadorBusqueda.bringToFront();
    }

    function destacarLinea(nombre) {
      lineaDestacada = nombre;

      // Si la línea estaba oculta (casilla o filtro UV), mostrarla
      const layers = capasLineas[nombre] || [];
      layers.forEach(l => { if (!map.hasLayer(l)) map.addLayer(l); });
      const chk = document.querySelector(`.check-linea[onchange*="'${nombre}'"]`);
      if (chk) chk.checked = true;
      sincronizarMaestro();

      // Hay líneas visibles: la capa "Recorridos Buses" debe verse marcada
      const chkCapa = document.querySelector('.check-capa[data-capa="Recorridos Buses"]');
      if (chkCapa) chkCapa.checked = true;

      aplicarDestacado(nombre);
      actualizarChips();
    }

    function quitarDestacado() {
      if (!lineaDestacada) return;
      lineaDestacada = null;

      const grupo = overlays['Recorridos Buses'];
      if (grupo) {
        grupo.eachLayer(l => {
          grupo.resetStyle(l);
          const el = l.getElement();
          if (el) {
            el.classList.remove('linea-sin-sombra');
            el.style.opacity = 1;
          }
        });
      }

      decoradoresCapas.forEach(decs => {
        decs.forEach(d => { if (map.hasLayer(d)) map.removeLayer(d); });
      });

      actualizarChips();
    }

    function actualizarChips() {
      infoBusqueda.querySelectorAll('.chip').forEach(chip => {
        const activa = chip.dataset.linea === lineaDestacada;
        chip.classList.toggle('activo', activa);
        chip.setAttribute('aria-pressed', activa);
      });
    }

    // Clic en una etiqueta: destacar; segundo clic en la misma: quitar
    infoBusqueda.addEventListener('click', e => {
      const chip = e.target.closest('.chip');
      if (!chip) return;
      if (chip.dataset.linea === lineaDestacada) quitarDestacado();
      else destacarLinea(chip.dataset.linea);
    });

    // Clic en una zona vacía del mapa: quitar destacado.
    // Se mantiene si el clic fue sobre una UV, una ruta o el marcador de búsqueda.
    map.on('click', e => {
      if (!lineaDestacada) return;
      const origen = e.sourceTarget;
      if (origen === marcadorBusqueda) return;
      const props = origen && origen.feature && origen.feature.properties;
      if (props && (props.NOMBRE_UV || props.linea)) return;
      quitarDestacado();
    });

    // Tecla Escape: quitar destacado
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && lineaDestacada) quitarDestacado();
    });

    function limpiarBusqueda() {
      quitarDestacado();
      inputBuscar.value = '';
      btnLimpiar.hidden = true;
      infoBusqueda.hidden = true;
      ocultarResultados();
      if (peticionBusqueda) peticionBusqueda.abort();
      if (marcadorBusqueda) {
        map.removeLayer(marcadorBusqueda);
        marcadorBusqueda = null;
      }
      inputBuscar.focus();
    }

    // Buscar mientras escribe (con pausa para no saturar el servicio)
    inputBuscar.addEventListener('input', () => {
      const texto = inputBuscar.value.trim();
      btnLimpiar.hidden = !inputBuscar.value;
      clearTimeout(temporizadorBusqueda);

      if (texto.length < 3) {
        ocultarResultados();
        return;
      }
      temporizadorBusqueda = setTimeout(() => buscarCalle(texto), 350);
    });

    // Teclado: flechas, Enter y Escape
    inputBuscar.addEventListener('keydown', e => {
      const n = resultadosBusqueda.length;
      if (e.key === 'ArrowDown' && n && !listaResultados.hidden) {
        e.preventDefault();
        indiceActivo = (indiceActivo + 1) % n;
        resaltarActivo();
      } else if (e.key === 'ArrowUp' && n && !listaResultados.hidden) {
        e.preventDefault();
        indiceActivo = (indiceActivo - 1 + n) % n;
        resaltarActivo();
      } else if (e.key === 'Enter' && n && !listaResultados.hidden) {
        e.preventDefault();
        seleccionarResultado(resultadosBusqueda[Math.max(indiceActivo, 0)]);
      } else if (e.key === 'Escape') {
        ocultarResultados();
      }
    });

    listaResultados.addEventListener('click', e => {
      const li = e.target.closest('li[data-i]');
      if (li) seleccionarResultado(resultadosBusqueda[+li.dataset.i]);
    });

    // Cerrar sugerencias al hacer clic fuera del buscador
    document.addEventListener('click', e => {
      if (!e.target.closest('.buscador')) ocultarResultados();
    });


    // ======================
    // EJECUTAR
    // ======================

    cargarCapas();

  </script>

</body>
